name: Vérifications

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verifier:
    name: Types, tests et données
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node 22 est requis : les tests s'exécutent sur des fichiers TypeScript
      # sans transpileur, ce que le retrait de types intégré permet à partir de
      # Node 22.18.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      # Avant les tests : un flux cassé ne se voit qu'au lancement, sur un
      # exécuteur qui coûte quinze minutes. Ce contrôle-ci prend une seconde.
      - name: Analyser les flux de travail
        run: npm run verifier:flux

      - name: Lancer les tests
        run: npm test

      # Le seul contrôle qui reproduise fidèlement ce que fait un build natif :
      # Metro parcourt le graphe de modules depuis l'entrée. C'est là que se
      # manifeste un défaut qu'aucun test ni `tsc` ne voit — un paquet qui
      # réclame un module que personne ne déclare. Cela s'est produit :
      # `expo-router@4.0.22` appelle `query-string`, fourni par
      # `@react-navigation/core` jusqu'à la 7.22.0, retiré en 7.22.1. Le build
      # macOS échouait au bout de quinze minutes ; ce contrôle-ci prend deux.
      #
      # `--clear` sur le premier : le cache de transformation de Metro n'est pas
      # indexé sur les valeurs de `EXPO_PUBLIC_*`. Un cache chaud peut donc
      # figer une configuration périmée dans le paquet, silencieusement.
      - name: Éprouver l'empaquetage Metro
        run: |
          npx expo export --platform ios --output-dir .tmp-export-ios --clear
          npx expo export --platform android --output-dir .tmp-export-android

      # Éprouve le schéma Supabase sous un vrai Postgres compilé en WebAssembly :
      # clés primaires composites, politiques RLS des deux côtés (lecture et
      # écriture), et remplacement atomique des données. C'est le seul garde-fou
      # automatique sur la frontière de sécurité.
      - name: Éprouver le schéma Supabase
        run: npm run verifier:supabase

      - name: Vérifier le pavage des divisions coraniques
        run: python3 data/quran/verifier_divisions.py

      # La pagination du moushaf porte désormais l'affichage « page par page » et
      # la mesure d'activité en pages. Une page fausse ne se voit pas sur un
      # écran ; elle se voit sur les invariants. Ce contrôle vérifie aussi que
      # les juz' et rub' du fichier de texte coïncident avec `divisions.json`,
      # qui vient d'une autre source : deux tables de divisions indépendantes
      # doivent tomber d'accord au verset près.
      #
      # Le recoupement avec l'API quran.com n'est pas ici : il dépend du réseau,
      # et une vérification qu'on veut rejouable hors ligne ne doit pas échouer
      # pour cette raison. Il se lance à la demande : `npm run recouper:pages`.
      - name: Vérifier la pagination du moushaf
        run: npm run verifier:pages

      # La pagination dit quels versets une page porte ; elle ne dit pas où
      # chaque mot tombe. `moushaf_layout.json` porte les coupures de ligne du
      # moushaf imprimé — quinze lignes par page, chaque élément désignant un
      # intervalle de jetons du texte. Une coupure fausse ne se voit pas à
      # l'œil sur un écran : elle met un mot sur la ligne du voisin. Ce
      # contrôle-ci vérifie hors ligne les quinze lignes, la contiguïté des
      # jetons d'un verset, le placement de chaque verset une seule fois, la
      # règle des ouvertures de sourate et l'ensemble exact des en-têtes
      # renvoyés en marge.
      - name: Vérifier la mise en page du moushaf
        run: npm run verifier:layout

      # La mise en page ne range pas du texte : elle range, pour chaque mot, le
      # point de code que la police de sa page dessine. Une seule erreur et le
      # mot s'imprime en pavé — un rectangle de remplissage — la page paraissant
      # complète tout en étant fausse. Le piège est que la table des caractères
      # ne le dit pas : les 604 polices portent les mêmes 720 points de code et
      # les mêmes 608 emplacements. Ce qui change, c'est le dessin. Le contrôle
      # lit donc la forme des glyphes, et exige en plus que chaque police
      # dessine exactement ses mots plus les seize ornements de page — un témoin
      # qui attrape aussi le mot que la mise en page aurait oublié de placer.
      - name: Vérifier les codes de police du moushaf
        run: npm run verifier:polices

      # Le contrôle ci-dessus ouvre les polices, mais il ne dit rien de la table
      # qui les fait trouver par Metro : `src/data/policesPages.ts` porte les 604
      # chemins, écrits **en clair**. Metro ne suit pas un `require` calculé — un
      # chemin construit dans une boucle ne serait pas résolu, et les pages
      # s'afficheraient sans leur police. Ce fichier est engendré ; ce contrôle
      # refuse qu'il dérive de son manifeste.
      - name: Vérifier la table des polices de page
        run: npm run verifier:polices-ts

      # Le pavage dit que les divisions s'emboîtent ; il ne dit rien de leur
      # origine. 151 des 480 toumoun ont une borne déduite par report depuis les
      # données Qaloun, donc estimée à un verset près — et l'application les
      # présente exactement comme les autres. `docs/divisions-estimees.md` les
      # liste une par une. Il est engendré : ce contrôle refuse qu'il dérive des
      # données sans que personne ne le voie.
      - name: Vérifier le rapport des bornes estimées
        run: npm run verifier:rapport

      # Réintroduit volontairement chaque défaut que les tests de sauvegarde
      # prétendent couvrir, et exige que le test échoue. Un test qu'on n'a jamais
      # vu échouer ne prouve rien. Le script restaure les fichiers à l'octet près
      # et le vérifie par empreinte SHA-256.
      - name: Falsifier les tests de sauvegarde
        run: python3 scripts/falsifier_tests_sync.py

      # Même exigence pour le rapport : un document engendré qu'on n'a jamais vu
      # refuser une dérive ne prouve pas qu'il la détecte.
      - name: Falsifier le rapport des bornes estimées
        run: npm run falsifier:rapport

      # Et pour la pagination : cinq mutations de la donnée, dont une frontière
      # déplacée d'un seul verset. Chacune doit tomber, et tomber sur le
      # contrôle qui la vise — un contrôle sans rapport qui échoue par ricochet
      # ferait croire vérifié ce qui ne l'est pas.
      - name: Falsifier les contrôles de pagination
        run: npm run falsifier:pages

      # Et pour la mise en page : huit mutations de la donnée, dont une ligne en
      # trop, un intervalle de jetons troué et une basmala rétrécie. Chacune doit
      # tomber, et tomber sur le contrôle qui la vise.
      - name: Falsifier les contrôles de mise en page
        run: npm run falsifier:layout

      # Et pour les codes de police : quatre mutations, dont un mot qui prend un
      # code que sa police dessine en pavé, un mot qui prend un ornement, et un
      # octet retourné dans un fichier de police. Cette dernière éprouve le
      # contrôle d'identité, qui confronte chaque police au manifeste par sa
      # taille et son empreinte SHA-256.
      #
      # C'est ce falsificateur qui a montré qu'une première version du contrôle
      # ne pouvait rien voir : elle filtrait la liste des codes attendus au lieu
      # de demander à la police ce qu'elle trace, si bien que la branche des
      # dessins orphelins était vide par construction.
      - name: Falsifier les contrôles de codes de police
        run: npm run falsifier:polices

      # Et pour la page du moushaf telle qu'elle se dessine : huit mutations des
      # deux fichiers qui portent sa géométrie et ses codes, chacune devant
      # tomber sur le test nommé pour elle. Le témoin de ce script exige en plus
      # que le fichier de tests ait été réellement joué — `node --test` sort en 0
      # quand aucun test ne s'exécute, et un banc qui se contenterait du code de
      # sortie annoncerait « mutation détectée » pour une raison qui n'a rien à
      # voir avec le code muté.
      - name: Falsifier les contrôles de la page du moushaf
        run: npm run falsifier:moushaf

      # Et pour l'accès au texte : trois mutations du code de `quranData.ts`,
      # dont le rang du verset qui cesse d'être vérifié. Ce défaut-là a vécu
      # sans être vu — `getAyahText(29, 70)` rendait 30:1, basmala comprise,
      # parce que le cache est un tableau plat indexé par l'identifiant global.
      # Un verset faux ne se signale pas : il s'affiche.
      - name: Falsifier les contrôles d'accès au texte
        run: npm run falsifier:acces-texte

      # Et pour « À renforcer » : six mutations, dont un passage marqué et dû qui
      # perdrait son item de révision, et une révision en retard qui
      # disparaîtrait parce que la comparaison de dates serait une égalité au
      # lieu d'un ordre. Aucune des deux ne se verrait sur un téléphone.
      - name: Falsifier les contrôles de renforcement
        run: npm run falsifier:renforcement

  # Le tableau de bord a ses propres données, ses propres tests et ses propres
  # contrôles, et il n'était dans aucun flux : rien ne disait qu'il tenait
  # debout. Un falsificateur dont les ancres visent du code renommé ne le dit pas
  # non plus — il rapporte « mutation non détectée » et accuse le code au lieu de
  # lui-même. Cela s'est produit.
  tableau-de-bord:
    name: Tableau de bord
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      # Avant les tests : les données du tableau de bord sont une copie de celles
      # de l'application, comparée par empreinte SHA-256. Si elles ont dérivé,
      # les tests qui suivent porteraient sur autre chose que ce qui sera relu.
      - name: Vérifier la synchronisation des données
        run: npm run donnees:verifier

      - name: Lancer les tests
        run: npm test

      # `next build` n'était lancé nulle part : le tableau de bord n'avait jamais
      # été construit pour la production, alors que c'est exactement ce que ferait
      # un déploiement. Il compile, passe les types et engendre ses six pages
      # statiques — vérifié à la main. En local, un garde-fou de l'environnement
      # refuse la suppression en bloc du cache `.next` que Next.js effectue en fin
      # de construction : le refus ne dit rien du projet, mais il empêche de
      # conclure. Ici, il conclut.
      #
      # Les deux valeurs sont passées au build : Next.js les inline dans le paquet
      # client, donc les omettre livrerait un tableau de bord sans configuration,
      # et rien dans le journal ne le dirait. On les cherche ensuite dans ce qui
      # sera servi — même exigence que le flux Android, qui cherche la sienne dans
      # l'APK. Sans le refus sur variables absentes, un motif vide passerait
      # toujours : la vérification ne prouverait rien.
      - name: Construire pour la production
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Variables de dépôt absentes : le tableau de bord serait livré sans configuration."
            exit 1
          fi

          npm run build

          if [ ! -d .next/static ]; then
            echo "::error::La construction n'a produit aucun paquet client (.next/static)."
            exit 1
          fi

          HOTE=$(printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | sed 's#^https\?://##' | sed 's#/.*##')
          # Un fragment suffit à prouver l'inlining, et évite d'écrire la clé
          # entière dans un journal de build.
          FRAGMENT=$(printf '%s' "$NEXT_PUBLIC_SUPABASE_ANON_KEY" | cut -c1-24)

          manquants=""
          grep -rqa "$HOTE" .next/static || manquants="$manquants l'adresse « $HOTE »"
          grep -rqa "$FRAGMENT" .next/static || manquants="$manquants la cle publique"

          if [ -n "$manquants" ]; then
            echo "::error::Le paquet client ne contient pas :$manquants"
            exit 1
          fi

          echo "Le paquet client contient l'adresse et la cle publique attendues."

      # Les tests portent sur le code ; ce contrôle-ci porte sur les données, et
      # c'est d'elles que dépend une correction : la chaîne des toumoun est
      # continue, aucun début de rub' n'est présenté comme estimé, et le résumé
      # des métadonnées s'accorde avec les données.
      - name: Vérifier les bornes des toumoun
        run: npm run verifier:bornes

      # Onze mutations du code de `bornes.ts`, chacune devant tomber sur le test
      # qui la vise. Le témoin exige que le test nommé existe *et* passe : un
      # motif qui ne correspond à aucun test fait sortir `node --test` en 0, et
      # la mutation serait comptée « non détectée » pour une raison qui n'a rien
      # à voir avec le code.
      - name: Falsifier les contrôles de bornes
        run: npm run falsifier:bornes

      # Et quatre mutations des données elles-mêmes, présentées au contrôle
      # ci-dessus : un toumoun estimé qui déclare ouvrir un rub', une chaîne
      # rompue, un résumé qui ment, un début de rub' qui disparaît.
      - name: Falsifier le contrôle des bornes
        run: python3 scripts/falsifier_verifier_bornes.py
