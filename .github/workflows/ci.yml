name: Vérifications

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verifier:
    name: Types, tests et données
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node 22 est requis : les tests s'exécutent sur des fichiers TypeScript
      # sans transpileur, ce que le retrait de types intégré permet à partir de
      # Node 22.18.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      # Avant les tests : un flux cassé ne se voit qu'au lancement, sur un
      # exécuteur qui coûte quinze minutes. Ce contrôle-ci prend une seconde.
      - name: Analyser les flux de travail
        run: npm run verifier:flux

      - name: Lancer les tests
        run: npm test

      # Le seul contrôle qui reproduise fidèlement ce que fait un build natif :
      # Metro parcourt le graphe de modules depuis l'entrée. C'est là que se
      # manifeste un défaut qu'aucun test ni `tsc` ne voit — un paquet qui
      # réclame un module que personne ne déclare. Cela s'est produit :
      # `expo-router@4.0.22` appelle `query-string`, fourni par
      # `@react-navigation/core` jusqu'à la 7.22.0, retiré en 7.22.1. Le build
      # macOS échouait au bout de quinze minutes ; ce contrôle-ci prend deux.
      #
      # `--clear` sur le premier : le cache de transformation de Metro n'est pas
      # indexé sur les valeurs de `EXPO_PUBLIC_*`. Un cache chaud peut donc
      # figer une configuration périmée dans le paquet, silencieusement.
      - name: Éprouver l'empaquetage Metro
        run: |
          npx expo export --platform ios --output-dir .tmp-export-ios --clear
          npx expo export --platform android --output-dir .tmp-export-android

      # Éprouve le schéma Supabase sous un vrai Postgres compilé en WebAssembly :
      # clés primaires composites, politiques RLS des deux côtés (lecture et
      # écriture), et remplacement atomique des données. C'est le seul garde-fou
      # automatique sur la frontière de sécurité.
      - name: Éprouver le schéma Supabase
        run: npm run verifier:supabase

      - name: Vérifier le pavage des divisions coraniques
        run: python3 data/quran/verifier_divisions.py

      # La pagination du moushaf porte désormais l'affichage « page par page » et
      # la mesure d'activité en pages. Une page fausse ne se voit pas sur un
      # écran ; elle se voit sur les invariants. Ce contrôle vérifie aussi que
      # les juz' et rub' du fichier de texte coïncident avec `divisions.json`,
      # qui vient d'une autre source : deux tables de divisions indépendantes
      # doivent tomber d'accord au verset près.
      #
      # Le recoupement avec l'API quran.com n'est pas ici : il dépend du réseau,
      # et une vérification qu'on veut rejouable hors ligne ne doit pas échouer
      # pour cette raison. Il se lance à la demande : `npm run recouper:pages`.
      - name: Vérifier la pagination du moushaf
        run: npm run verifier:pages

      # Le pavage dit que les divisions s'emboîtent ; il ne dit rien de leur
      # origine. 151 des 480 toumoun ont une borne déduite par report depuis les
      # données Qaloun, donc estimée à un verset près — et l'application les
      # présente exactement comme les autres. `docs/divisions-estimees.md` les
      # liste une par une. Il est engendré : ce contrôle refuse qu'il dérive des
      # données sans que personne ne le voie.
      - name: Vérifier le rapport des bornes estimées
        run: npm run verifier:rapport

      # Réintroduit volontairement chaque défaut que les tests de sauvegarde
      # prétendent couvrir, et exige que le test échoue. Un test qu'on n'a jamais
      # vu échouer ne prouve rien. Le script restaure les fichiers à l'octet près
      # et le vérifie par empreinte SHA-256.
      - name: Falsifier les tests de sauvegarde
        run: python3 scripts/falsifier_tests_sync.py

      # Même exigence pour le rapport : un document engendré qu'on n'a jamais vu
      # refuser une dérive ne prouve pas qu'il la détecte.
      - name: Falsifier le rapport des bornes estimées
        run: npm run falsifier:rapport

      # Et pour la pagination : cinq mutations de la donnée, dont une frontière
      # déplacée d'un seul verset. Chacune doit tomber, et tomber sur le
      # contrôle qui la vise — un contrôle sans rapport qui échoue par ricochet
      # ferait croire vérifié ce qui ne l'est pas.
      - name: Falsifier les contrôles de pagination
        run: npm run falsifier:pages

      # Et pour « À renforcer » : six mutations, dont un passage marqué et dû qui
      # perdrait son item de révision, et une révision en retard qui
      # disparaîtrait parce que la comparaison de dates serait une égalité au
      # lieu d'un ordre. Aucune des deux ne se verrait sur un téléphone.
      - name: Falsifier les contrôles de renforcement
        run: npm run falsifier:renforcement
