name: Vérifications

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verifier:
    name: Types, tests et données
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node 22 est requis : les tests s'exécutent sur des fichiers TypeScript
      # sans transpileur, ce que le retrait de types intégré permet à partir de
      # Node 22.18.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      # Avant les tests : un flux cassé ne se voit qu'au lancement, sur un
      # exécuteur qui coûte quinze minutes. Ce contrôle-ci prend une seconde.
      - name: Analyser les flux de travail
        run: npm run verifier:flux

      - name: Lancer les tests
        run: npm test

      # Le seul contrôle qui reproduise fidèlement ce que fait un build natif :
      # Metro parcourt le graphe de modules depuis l'entrée. C'est là que se
      # manifeste un défaut qu'aucun test ni `tsc` ne voit — un paquet qui
      # réclame un module que personne ne déclare. Cela s'est produit :
      # `expo-router@4.0.22` appelle `query-string`, fourni par
      # `@react-navigation/core` jusqu'à la 7.22.0, retiré en 7.22.1. Le build
      # macOS échouait au bout de quinze minutes ; ce contrôle-ci prend deux.
      #
      # `--clear` sur le premier : le cache de transformation de Metro n'est pas
      # indexé sur les valeurs de `EXPO_PUBLIC_*`. Un cache chaud peut donc
      # figer une configuration périmée dans le paquet, silencieusement.
      - name: Éprouver l'empaquetage Metro
        run: |
          npx expo export --platform ios --output-dir .tmp-export-ios --clear
          npx expo export --platform android --output-dir .tmp-export-android

      # Éprouve le schéma Supabase sous un vrai Postgres compilé en WebAssembly :
      # clés primaires composites, politiques RLS des deux côtés (lecture et
      # écriture), et remplacement atomique des données. C'est le seul garde-fou
      # automatique sur la frontière de sécurité.
      - name: Éprouver le schéma Supabase
        run: npm run verifier:supabase

      - name: Vérifier le pavage des divisions coraniques
        run: python3 data/quran/verifier_divisions.py

      # La pagination du moushaf porte désormais l'affichage « page par page » et
      # la mesure d'activité en pages. Une page fausse ne se voit pas sur un
      # écran ; elle se voit sur les invariants. Ce contrôle vérifie aussi que
      # les juz' et rub' du fichier de texte coïncident avec `divisions.json`,
      # qui vient d'une autre source : deux tables de divisions indépendantes
      # doivent tomber d'accord au verset près.
      #
      # Le recoupement avec l'API quran.com n'est pas ici : il dépend du réseau,
      # et une vérification qu'on veut rejouable hors ligne ne doit pas échouer
      # pour cette raison. Il se lance à la demande : `npm run recouper:pages`.
      - name: Vérifier la pagination du moushaf
        run: npm run verifier:pages

      # La pagination dit quels versets une page porte ; elle ne dit pas d'où
      # vient son IMAGE. Or cette source doit rester unique et bornée : recopier
      # l'adresse ailleurs, ou laisser le lecteur recomposer la page, remettrait
      # deux vérités en circulation. Le second cas est le plus coûteux, parce
      # qu'il ne se signale pas — une page recomposée s'affiche, et elle ne
      # ressemble pas à la page imprimée sans qu'aucun test ne le dise.
      - name: Vérifier la source des images de page
        run: npm run verifier:pages-moushaf

      # La pagination dit quels versets une page porte ; elle ne dit pas où
      # chaque mot tombe. `moushaf_layout.json` porte les coupures de ligne du
      # moushaf imprimé — quinze lignes par page, chaque élément désignant un
      # intervalle de jetons du texte. Une coupure fausse ne se voit pas à
      # l'œil sur un écran : elle met un mot sur la ligne du voisin. Ce
      # contrôle-ci vérifie hors ligne les quinze lignes, la contiguïté des
      # jetons d'un verset, le placement de chaque verset une seule fois, la
      # règle des ouvertures de sourate et l'ensemble exact des en-têtes
      # renvoyés en marge.
      #
      # Il vérifie aussi que `largeurs_pages.json` décrit bien CETTE mise en
      # page. Les deux fichiers se régénèrent par des scripts différents et sont
      # lus tous les deux par l'application — l'un pour les coupures, l'autre
      # pour la taille à laquelle la page se dessine. La table enregistre
      # l'empreinte de la mise en page au moment de la mesure ; une coupure
      # déplacée d'un mot rend cette empreinte périmée, et le contrôle le dit.
      # Sans lui, la page se dessinerait à une taille légèrement fausse, et une
      # bande de surlignage tomberait à côté de son mot — sans que rien ne le
      # signale.
      #
      # Ce que ce contrôle ne dit plus, depuis que les 604 polices ne sont plus
      # dans le dépôt : que chaque code soit dessiné par la police de sa page,
      # et que les largeurs aient été mesurées justes. Les deux demandent
      # d'ouvrir les polices et se vérifient à la demande, après
      # `python scripts/recuperer_polices_pages.py` — dont le `--verifier`
      # confronte les 604 fichiers au manifeste, puis `npm run verifier:largeurs`
      # qui recalcule la mesure et la compare à la table.
      - name: Vérifier la mise en page du moushaf
        run: npm run verifier:layout

      # Les 604 polices de page ne sont plus dans le dépôt : aucun code ne les
      # emploie — la composition par police a été retirée du lecteur — et leur
      # poids de 92 Mo faisait dépasser la limite de 150 Mo du CDN qui sert les
      # pages (voir `.gitignore`). Les outils qui les lisent restent pourtant
      # versionnés, et c'est **délibéré** : `scripts/recuperer_polices_pages.py`
      # les rétablit à l'identique — son `--verifier` confronte les 604 fichiers
      # au manifeste `data/quran/polices_pages.json` — et
      # `scripts/mesurer_largeurs_pages.py` regénère
      # `data/quran/largeurs_pages.json`, que l'application emploie. Tous deux
      # se lancent **à la demande**, sur une copie des polices
      # (`npm run mesurer:largeurs`, `npm run verifier:largeurs`) : aucune étape
      # ne les appelle, et ce n'est pas un oubli.

      # Le pavage dit que les divisions s'emboîtent ; il ne dit rien de leur
      # origine. 151 des 480 toumoun ont une borne déduite par report depuis les
      # données Qaloun, donc estimée à un verset près — et l'application les
      # présente exactement comme les autres. `docs/divisions-estimees.md` les
      # liste une par une. Il est engendré : ce contrôle refuse qu'il dérive des
      # données sans que personne ne le voie.
      - name: Vérifier le rapport des bornes estimées
        run: npm run verifier:rapport

      # Réintroduit volontairement chaque défaut que les tests de sauvegarde
      # prétendent couvrir, et exige que le test échoue. Un test qu'on n'a jamais
      # vu échouer ne prouve rien. Le script restaure les fichiers à l'octet près
      # et le vérifie par empreinte SHA-256.
      - name: Falsifier les tests de sauvegarde
        run: python3 scripts/falsifier_tests_sync.py

      # Même exigence pour le rapport : un document engendré qu'on n'a jamais vu
      # refuser une dérive ne prouve pas qu'il la détecte.
      - name: Falsifier le rapport des bornes estimées
        run: npm run falsifier:rapport

      # Et pour la pagination : cinq mutations de la donnée, dont une frontière
      # déplacée d'un seul verset. Chacune doit tomber, et tomber sur le
      # contrôle qui la vise — un contrôle sans rapport qui échoue par ricochet
      # ferait croire vérifié ce qui ne l'est pas.
      - name: Falsifier les contrôles de pagination
        run: npm run falsifier:pages

      # Et pour la mise en page : dix mutations, en deux campagnes qui ne mutent
      # chacune que son fichier. Huit portent sur la donnée — dont une ligne en
      # trop, un intervalle de jetons troué et une basmala rétrécie — et doivent
      # tomber sur les contrôles 1 à 7. Les deux dernières portent sur la table
      # des largeurs, et doivent tomber sur le contrôle 8 SEUL : l'empreinte
      # périmée, et une ligne mesurée effacée là où la mise en page porte un
      # mot. C'est ce qui prouve que l'accord entre les deux fichiers est
      # réellement vérifié, et non supposé.
      #
      # Pendant la première campagne, l'empreinte de la table est remise à jour
      # après chaque pose. Sans cela, le contrôle 8 tomberait à chaque fois —
      # non parce que la mutation est vue, mais parce que la table ne décrit
      # plus le fichier — et le journal annoncerait huit détections par
      # ricochet.
      - name: Falsifier les contrôles de mise en page
        run: npm run falsifier:layout

      # Et pour la page du moushaf telle qu'elle se dessine : quinze mutations,
      # chacune devant tomber sur le test nommé pour elle. Quatre portent sur les
      # largeurs, trois sur les codes, cinq sur les ornements — une teinte
      # inventée, le médaillon privé de son emplacement puis muet, le cadre remis
      # dans le flux, et un caractère coranique écrit en dur. Les trois dernières
      # tiennent le lecteur : la composition qui ne doit pas revenir, la borne des
      # pages, et l'adresse écrite à un seul endroit. Le témoin de ce script exige
      # en plus que le
      # fichier de tests ait été réellement joué — `node --test` sort en 0 quand
      # aucun test ne s'exécute, et un banc qui se contenterait du code de sortie
      # annoncerait « mutation détectée » pour une raison qui n'a rien à voir avec
      # le code muté. Une ancre qui apparaît plusieurs fois fait refuser la
      # mutation : muter le mauvais endroit prouverait autre chose.
      - name: Falsifier les contrôles de la page du moushaf
        run: npm run falsifier:moushaf

      # Et pour la SOURCE des images de page : dix mutations, du nombre de pages
      # annoncé faux à l'URL recopiée hors de son module, en passant par le
      # `resizeMode` retiré — l'image serait alors déformée — et par le repli sur
      # l'URL distante supprimé, qui laisserait une page vide sans le dire.
      #
      # Il complète le précédent : celui-ci garde la page telle qu'elle se
      # dessine, celui-là garde d'où vient ce qui est dessiné. Le second garde en
      # particulier `LecteurPageMoushaf.tsx` — le fichier que l'on touche dès
      # qu'on change les commandes de lecture.
      - name: Falsifier les contrôles de la source des images de page
        run: npm run falsifier:pages-moushaf

      # Et pour l'accès au texte : trois mutations du code de `quranData.ts`,
      # dont le rang du verset qui cesse d'être vérifié. Ce défaut-là a vécu
      # sans être vu — `getAyahText(29, 70)` rendait 30:1, basmala comprise,
      # parce que le cache est un tableau plat indexé par l'identifiant global.
      # Un verset faux ne se signale pas : il s'affiche.
      - name: Falsifier les contrôles d'accès au texte
        run: npm run falsifier:acces-texte

      # Et pour « À renforcer » : six mutations, dont un passage marqué et dû qui
      # perdrait son item de révision, et une révision en retard qui
      # disparaîtrait parce que la comparaison de dates serait une égalité au
      # lieu d'un ordre. Aucune des deux ne se verrait sur un téléphone.
      - name: Falsifier les contrôles de renforcement
        run: npm run falsifier:renforcement

      # Et pour l'accueil : celui-ci tient un accord entre deux écrans qui ne
      # peuvent pas se lire — l'accueil émet le paramètre, l'onglet Programme le
      # consomme. Un nom de paramètre qui divergerait d'un côté ne casse ni la
      # compilation ni l'exécution : l'onglet s'ouvrirait simplement sur
      # « Apprentissage », ce qui ressemble à un bouton sans effet. Sept
      # mutations, dont la carte redevenue inerte et la bascule qui cesse de
      # dépendre de l'horodatage — sans lui, l'écran restant monté, le second
      # appui ne ferait plus rien.
      - name: Falsifier les contrôles de l'accueil
        run: npm run falsifier:accueil

      # Et pour le feuilletage de la page du moushaf : douze mutations. Ce
      # contrôle-ci en a corrigé trois qui ne détectaient rien — et les trois
      # manques étaient dans les tests, pas dans les mutations. Une assertion
      # « le conteneur de gestes est monté » se satisfaisait du mot trouvé dans
      # un commentaire et dans la ligne d'importation : retirer l'élément du JSX
      # passait. Rien n'exigeait non plus que la page se tourne au relâchement
      # (`.onEnd`) plutôt qu'au toucher, ni que les seuils de compatibilité avec
      # le défilement soient posés — sans eux, un geste vertical pour faire
      # défiler la page la tournerait. Sur un téléphone, aucune de ces trois
      # régressions ne se voit autrement que comme « ça saute des pages ».
      - name: Falsifier les contrôles du geste de page
        run: npm run falsifier:geste-page

      # Et pour le suivi entre amis : quatorze mutations de la couche de lecture.
      # Ce falsificateur-ci a servi dès sa première exécution — deux de ses
      # mutations ne détectaient rien, et l'une des deux n'était pas une
      # faiblesse du test : elle réduisait `Math.max(0, Math.round(n))` à
      # `Math.round(Math.max(0, n))`, qui rend la même valeur pour toute entrée.
      # Un moteur de mutation qui compte ces réductions pour des défauts fait
      # accuser le code à tort. La seconde, elle, était un vrai trou : rien
      # n'exigeait que `Infinity` fût refusé, et `Math.round(Infinity)` sort
      # « Infinity » — une phrase que personne n'aurait lue comme un nombre.
      - name: Falsifier les contrôles du suivi entre amis
        run: npm run falsifier:amis

      # Et l'attente bornée. Les deux ronds de chargement qui tournaient sans
      # fin — à la connexion et sur « Mes amis » — venaient d'un `await` qui ne
      # se résolvait jamais. Le remède n'est pas de savoir pourquoi : c'est de
      # ne jamais attendre sans borne. Ce falsificateur-ci a trouvé deux vrais
      # trous, dont un grave : rien n'exigeait que l'attente soit bornée à
      # l'intérieur du helper partagé, si bien que retirer `borner` d'un seul
      # endroit laissait quatre des cinq appels entre amis sans limite, fichier
      # vert. Il vérifie aussi que le verrou de réentrance est bien RELÂCHÉ :
      # sans quoi le bouton deviendrait inerte après un premier appui.
      - name: Falsifier les contrôles de l'attente bornée
        run: npm run falsifier:attente

      # Et le stockage morcelé de la session — parce que c'est LUI qui faisait
      # tourner le rond. `expo-secure-store` refuse toute clé hors de
      # `[A-Za-z0-9._-]`, et il refuse en LEVANT ; or les clés composées
      # portaient un `::`. Chaque lecture et chaque écriture de session levait
      # donc. Deux symptômes signalés depuis un téléphone, une seule cause : la
      # connexion échouait alors que les identifiants étaient bons, et
      # `getSession()` rejetait au lieu de rendre `null`, ce qui laissait
      # « Mes amis » sur un rond sans fin — `connecte` n'étant jamais posé.
      #
      # Le banc ne pouvait pas le voir : il employait un dépôt EN MÉMOIRE qui
      # acceptait n'importe quelle clé, et il écrivait `'session::nb'` en toutes
      # lettres. Il confronte maintenant chaque clé à la règle RÉELLE, lue dans
      # le paquet installé. La mutation qui remet le `::` est détectée, et elle
      # ne l'aurait pas été avant.
      - name: Falsifier les contrôles du stockage morcelé
        run: npm run falsifier:stockage

      # Et le surlignage de la séance avec la forme du lecteur. Le calcul est
      # éprouvé ; ce qui ne se calcule pas — la place d'une bande, sa hauteur,
      # l'ordre avec l'image — est tenu par des contrôles qui réintroduisent
      # dans le rendu ce qui a été retiré, pour vérifier qu'ils le voient. Trois
      # mutations n'étaient pas détectées à la première exécution, et les trois
      # accusaient le test : rien n'assertait le décalage vertical d'une bande,
      # rien n'assertait sa hauteur, et rien n'assertait que la plage de la
      # séance était seulement transmise à la page.
      - name: Falsifier les contrôles du surlignage et du lecteur
        run: npm run falsifier:surlignage

      # Et le lecteur audio : vingt mutations, plus une sentinelle.
      #
      # Ce qui est éprouvé ici ne se voit PAS quand c'est faux. Une zone de
      # surlignage placée en miroir est de la bonne taille, de la bonne couleur,
      # et posée sur le verset voisin ; un appui dans le blanc qui ne désigne
      # rien ressemble à un appui manqué ; un verset oublié au milieu d'une plage
      # donne une écoute qui paraît complète.
      #
      # La sentinelle — une mutation sans effet, qui doit être signalée NON
      # DÉTECTÉE — est là pour que « non détectée » soit prononcé, et non confondu
      # avec un succès.
      #
      # Le falsificateur a trouvé un défaut réel à sa première exécution : après
      # l'auto-stop, le plan RESTE en place et l'index revient à zéro, donc
      # `etapeCourante` désigne le premier verset. Rien n'assertait que la bande
      # devait disparaître dans cet état — elle serait revenue sur le premier
      # verset au moment où la séance se termine. Le test manquant a été écrit.
      #
      # Le contrôle d'ordre, lui, déplace RÉELLEMENT le bloc de surlignage après
      # l'image : l'ordre de deux blocs ne se casse pas par substitution de texte.
      - name: Falsifier les contrôles du lecteur audio
        run: npm run falsifier:audio

      # Et pour les objectifs et les rythmes de l'inscription : quinze mutations.
      #
      # Le défaut visé est MUET. Le rendu parcourt `ORDRE_NIVEAUX`, puis filtre
      # `RYTHMES` par niveau ; un rythme rangé sous un niveau absent de cette
      # liste n'apparaîtrait donc NULLE PART — ni erreur, ni écran vide, ni
      # journal : une proposition en moins, que personne ne réclame. Deux
      # mutations portent précisément là-dessus.
      #
      # Le questionnaire est aussi le seul endroit où une quantité fausse se
      # propage sans bruit dans tout l'algorithme de progression : un rythme dont
      # la quantité dérive ne casse rien, il fait travailler trop ou trop peu.
      - name: Falsifier les objectifs et les rythmes
        run: npm run falsifier:objectifs

      # L'espace de discussion entre deux amis : un fil de mots, modéré.
      #
      # Deux fichiers de tests le tiennent, et il faut les deux. Les décisions
      # pures (conversion des lignes, bornes de longueur, ordre du fil, dates)
      # sont dans `tests/discussion.test.mjs`. La couche RÉSEAU est dans
      # `tests/discussion_reseau.test.mjs` : c'est là que vivent les trois
      # défauts silencieux — une attente non bornée, un délai dépassé présenté
      # comme un fil vide, et une paire envoyée non rangée que la base refuse.
      #
      # Ce dernier fichier remplace le client et la session par des doublures
      # déposées sur disque, et relues par `scripts/alias-loader.mjs` à chaque
      # chargement. Le disque, et non un `Map` partagé : `--import` instancie le
      # chargeur dans un contexte séparé, si bien qu'un module importé des deux
      # côtés est évalué deux fois — deux registres distincts, une doublure
      # invisible, et un échec qui parle d'un module React Native non transpilé.
      # La neutralisation du chargeur fait tomber 17 tests sur 30, ce qui est la
      # preuve que les doublures portent vraiment.
      - name: Falsifier les contrôles de l'espace de discussion
        run: npm run falsifier:discussion

      # Les liens de courriel : confirmation d'adresse, et réinitialisation de
      # mot de passe.
      #
      # Le défaut le plus coûteux de cette partie est TOTALEMENT MUET : Supabase
      # dépose les jetons dans le FRAGMENT de l'adresse de retour, et
      # `new URL(url).searchParams` ne voit pas le fragment. Un module écrit
      # avec `searchParams` rendrait un lien vide sur un lien parfaitement
      # valide, sans lever et sans rien afficher — l'utilisateur verrait un
      # écran qui ne fait rien, et n'aurait aucun moyen de savoir pourquoi.
      #
      # Le contrôle porte sur le CODE et non sur le texte : le module ET son
      # test CITENT tous deux `searchParams` pour expliquer le piège, donc un
      # contrôle qui lirait le source brut se déclencherait sur sa propre
      # documentation. C'est arrivé, et c'est corrigé.
      #
      # Le second point visé est la forme de l'écran : les quatre gestes
      # d'authentification passent par UN lanceur partagé qui porte le verrou de
      # réentrance et la borne de délai. Deux mutations le vérifient — un geste
      # qui contourne le lanceur, et la borne retirée.
      - name: Falsifier les contrôles des liens de courriel
        run: npm run falsifier:lien

      # Les notifications : le module des décisions, et la cible d'un appui.
      #
      # Le défaut le plus coûteux de cette partie ne se voit pas à l'usage : le
      # module des décisions doit n'IMPORTER RIEN. Un seul import d'Expo le
      # rendrait inéprouvable, et il continuerait de fonctionner sur l'appareil —
      # on ne perdrait pas la fonctionnalité, on perdrait le moyen de la
      # vérifier. C'est la mutation qui compte le plus ici.
      #
      # Le second point est la cible d'un appui sur une notification : les
      # données reçues viennent du réseau et ne sont pas fiables. Une cible
      # construite à moitié ouvrirait un écran de discussion sans destinataire —
      # un écran vide, sans erreur, et sans rien pour l'expliquer.
      - name: Falsifier les contrôles des notifications
        run: npm run falsifier:notifications

  # Le tableau de bord a ses propres données, ses propres tests et ses propres
  # contrôles, et il n'était dans aucun flux : rien ne disait qu'il tenait
  # debout. Un falsificateur dont les ancres visent du code renommé ne le dit pas
  # non plus — il rapporte « mutation non détectée » et accuse le code au lieu de
  # lui-même. Cela s'est produit.
  tableau-de-bord:
    name: Tableau de bord
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      # Avant les tests : les données du tableau de bord sont une copie de celles
      # de l'application, comparée par empreinte SHA-256. Si elles ont dérivé,
      # les tests qui suivent porteraient sur autre chose que ce qui sera relu.
      - name: Vérifier la synchronisation des données
        run: npm run donnees:verifier

      - name: Lancer les tests
        run: npm test

      # `next build` n'était lancé nulle part : le tableau de bord n'avait jamais
      # été construit pour la production, alors que c'est exactement ce que ferait
      # un déploiement. Il compile, passe les types et engendre ses six pages
      # statiques — vérifié à la main. En local, un garde-fou de l'environnement
      # refuse la suppression en bloc du cache `.next` que Next.js effectue en fin
      # de construction : le refus ne dit rien du projet, mais il empêche de
      # conclure. Ici, il conclut.
      #
      # Les deux valeurs sont passées au build : Next.js les inline dans le paquet
      # client, donc les omettre livrerait un tableau de bord sans configuration,
      # et rien dans le journal ne le dirait. On les cherche ensuite dans ce qui
      # sera servi — même exigence que le flux Android, qui cherche la sienne dans
      # l'APK. Sans le refus sur variables absentes, un motif vide passerait
      # toujours : la vérification ne prouverait rien.
      - name: Construire pour la production
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Variables de dépôt absentes : le tableau de bord serait livré sans configuration."
            exit 1
          fi

          npm run build

          if [ ! -d .next/static ]; then
            echo "::error::La construction n'a produit aucun paquet client (.next/static)."
            exit 1
          fi

          HOTE=$(printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | sed 's#^https\?://##' | sed 's#/.*##')
          # Un fragment suffit à prouver l'inlining, et évite d'écrire la clé
          # entière dans un journal de build.
          FRAGMENT=$(printf '%s' "$NEXT_PUBLIC_SUPABASE_ANON_KEY" | cut -c1-24)

          manquants=""
          grep -rqa "$HOTE" .next/static || manquants="$manquants l'adresse « $HOTE »"
          grep -rqa "$FRAGMENT" .next/static || manquants="$manquants la cle publique"

          if [ -n "$manquants" ]; then
            echo "::error::Le paquet client ne contient pas :$manquants"
            exit 1
          fi

          echo "Le paquet client contient l'adresse et la cle publique attendues."

      # Les tests portent sur le code ; ce contrôle-ci porte sur les données, et
      # c'est d'elles que dépend une correction : la chaîne des toumoun est
      # continue, aucun début de rub' n'est présenté comme estimé, et le résumé
      # des métadonnées s'accorde avec les données.
      - name: Vérifier les bornes des toumoun
        run: npm run verifier:bornes

      # Onze mutations du code de `bornes.ts`, chacune devant tomber sur le test
      # qui la vise. Le témoin exige que le test nommé existe *et* passe : un
      # motif qui ne correspond à aucun test fait sortir `node --test` en 0, et
      # la mutation serait comptée « non détectée » pour une raison qui n'a rien
      # à voir avec le code.
      - name: Falsifier les contrôles de bornes
        run: npm run falsifier:bornes

      # Et quatre mutations des données elles-mêmes, présentées au contrôle
      # ci-dessus : un toumoun estimé qui déclare ouvrir un rub', une chaîne
      # rompue, un résumé qui ment, un début de rub' qui disparaît.
      - name: Falsifier le contrôle des bornes
        run: python3 scripts/falsifier_verifier_bornes.py
