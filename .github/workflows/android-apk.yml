name: APK Android

# Produit un APK Android installable, sans compte ni service externe.
#
# Pourquoi pas EAS Build : `eas build` exige un projet EAS enregistré
# (`extra.eas.projectId`) et un compte. La chaîne d'outils native, elle, ne
# demande rien — et `expo prebuild` génère une configuration `release` signée
# avec la clé de débogage, ce qui suffit à installer l'APK sur un téléphone
# pour l'essayer.
#
# Attention : cette clé de débogage n'est PAS une clé de publication. Le jour
# où l'application irait sur un store, il faudrait une clé de release — et
# Android interdit d'en changer ensuite pour une même application.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  apk:
    name: Compiler un APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Exiger la configuration
        # Un ÉCHEC, et non un avertissement : un binaire livré sans configuration
        # ne le dit pas. L'écran « Sauvegarde » afficherait « non configuré »,
        # et rien dans le build ne l'aurait signalé.
        #
        # Ces deux valeurs sont publiques par nature (URL du projet et clé
        # `anon`, embarquée dans l'application) : ce sont des *variables*, et
        # non des secrets.
        run: |
          manquantes=""

          for nom in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!nom}" ]; then
              manquantes="$manquantes $nom"
            fi
          done

          if [ -n "$manquantes" ]; then
            echo "::error::Variables de dépôt absentes :$manquantes"
            echo "À poser dans Settings > Secrets and variables > Actions >"
            echo "Variables, onglet « Variables » — et non « Secrets »."
            exit 1
          fi

          echo "Configuration Supabase présente."

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types et les tests
        run: |
          npm run typecheck
          npm test

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --clean

      - name: Compiler l'APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Empaqueter
        id: paquet
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          FICHIER="hifdh-$VERSION.apk"

          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::Aucun APK produit dans apk/release."
            exit 1
          fi

          cp "$APK" "$FICHIER"
          echo "fichier=$FICHIER" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$FICHIER"

      - name: Vérifier le contenu du paquet
        # Un APK est une archive ZIP. On y cherche la configuration attendue,
        # qui n'existe que si les variables étaient déclarées au niveau du job.
        #
        # Les DEUX valeurs sont cherchées séparément : n'en contrôler qu'une
        # laisserait passer le cas où l'autre n'a pas été inlinée.
        run: |
          FICHIER="${{ steps.paquet.outputs.fichier }}"

          HOTE=$(printf '%s' "$EXPO_PUBLIC_SUPABASE_URL" | sed 's#^https\?://##' | sed 's#/.*##')
          # Un fragment suffit à prouver l'inlining, et évite d'écrire la clé
          # entière dans un journal de build.
          FRAGMENT=$(printf '%s' "$EXPO_PUBLIC_SUPABASE_ANON_KEY" | cut -c1-24)

          # Le bundle est un asset compressé dans l'APK : on le décompresse
          # avant de le fouiller, un `grep` sur l'archive ne verrait rien.
          mkdir -p .tmp-apk
          unzip -o -q "$FICHIER" 'assets/*' -d .tmp-apk

          BUNDLE=$(find .tmp-apk -type f -name '*index.android.bundle' | head -n 1)

          if [ -z "$BUNDLE" ]; then
            echo "::error::Le paquet ne contient pas de assets/*index.android.bundle."
            unzip -l "$FICHIER" | grep assets | head -20
            exit 1
          fi

          manquants=""
          grep -aq "$HOTE" "$BUNDLE" || manquants="$manquants l'adresse « $HOTE »"
          grep -aq "$FRAGMENT" "$BUNDLE" || manquants="$manquants la clé publique"

          if [ -n "$manquants" ]; then
            echo "::error::Le paquet ne contient pas :$manquants"
            echo "Les variables EXPO_PUBLIC_* doivent être déclarées au niveau du job."
            exit 1
          fi

          echo "Le paquet contient l'adresse et la clé publique attendues."
          ls -l "$BUNDLE"
          rm -rf .tmp-apk

      - name: Publier l'artefact
        uses: actions/upload-artifact@v7
        with:
          name: apk-android
          path: ${{ steps.paquet.outputs.fichier }}
          if-no-files-found: error
          retention-days: 30

      - name: Publier la version (étiquette seulement)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FICHIER="${{ steps.paquet.outputs.fichier }}"
          VERSION="${{ steps.paquet.outputs.version }}"

          # Les deux flux (iOS et Android) attachent à la même version, et
          # peuvent la créer en même temps. Un `create` qui échoue parce que
          # l'autre vient de la créer ne doit pas faire échouer un build de
          # quinze minutes : on retombe alors sur un envoi.
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && \
            gh release upload "$GITHUB_REF_NAME" "$FICHIER" --clobber || \
            gh release create "$GITHUB_REF_NAME" "$FICHIER" \
              --title "Hifdh $VERSION" \
              --notes "APK Android signé avec la clé de débogage, à installer directement." \
              --generate-notes || \
            gh release upload "$GITHUB_REF_NAME" "$FICHIER" --clobber

      - name: Expliquer la suite
        run: |
          {
            echo "## APK produit"
            echo ""
            echo "Fichier : \`${{ steps.paquet.outputs.fichier }}\`"
            echo ""
            echo "Cet APK s'installe directement sur un téléphone Android :"
            echo "il est signé avec la clé de débogage. Android affichera un"
            echo "avertissement d'installation depuis une source inconnue."
            echo ""
            echo "Cette clé ne convient pas à une publication sur un store :"
            echo "Android interdit de changer de clé pour une même application."
          } >> "$GITHUB_STEP_SUMMARY"
